/* GAME_FONT_END */
:root{--st:#DFE8EC;--nv:#17293D;--bt:#AA174C;--tq:#008D99;--wh:#fff;--tq2:#6fdbe4;--st2:#b9c9d1;--nv2:#233b55;
--f:Heebo,"Segoe UI","Arial Hebrew",Arial,sans-serif;--d:"Archivo Black",Heebo,"Arial Black",Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--nv);overflow:hidden}
body{font-family:var(--f);font-weight:700;color:var(--nv);font-size:14px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;font-weight:800;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:var(--tq);font-weight:800}a:hover{color:var(--bt)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tq2);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--st);height:100vh;height:100dvh;overflow:hidden}
/* HUD */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--nv);color:var(--wh);border-bottom:3px solid var(--tq);z-index:5}
#hud .sg{font-family:var(--d);font-size:11px;letter-spacing:.5px;color:var(--tq2);border:1.5px solid var(--tq2);border-radius:3px;padding:2px 5px;text-shadow:0 0 6px var(--tq);white-space:nowrap}
#hud .st{flex:1;min-width:0;display:flex;gap:10px;font-size:12px;white-space:nowrap;overflow:hidden}
#hud .st b{font-family:var(--d);font-size:14px;color:var(--wh);font-weight:400}
#hud .st span{color:var(--st2)}
.ib{width:34px;height:34px;border-radius:6px;background:var(--nv2);display:grid;place-items:center;color:var(--wh);flex:0 0 auto}
.ib svg{width:18px;height:18px}.ib:active{background:var(--tq)}
/* GAME */
#game{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#wall{position:absolute;inset:0 0 40% 0;background:var(--st)}
#wall svg,#ctr svg{position:absolute;inset:0;width:100%;height:100%}
#ctr{position:absolute;left:0;right:0;bottom:0;height:46%;}
#railbar{position:relative;z-index:2;flex:0 0 auto;height:8px;margin:6px 6px 0;border-radius:4px;background:linear-gradient(#f4f8fa,#9db0ba 60%,#6e838f);box-shadow:0 2px 0 rgba(23,41,61,.35)}
#rail{position:relative;z-index:2;flex:0 0 auto;display:flex;gap:8px;padding:0 10px 12px;overflow-x:auto;overflow-y:hidden;min-height:clamp(120px,36%,230px);max-height:50%;align-items:flex-start;scrollbar-width:none;touch-action:pan-x}
#rail::-webkit-scrollbar{display:none}
#rail .empty{align-self:center;margin:auto;color:var(--nv);background:rgba(255,255,255,.7);padding:6px 10px;border-radius:4px;font-size:12px}
.tkw{flex:0 0 128px;width:128px;position:relative;filter:drop-shadow(0 3px 0 rgba(23,41,61,.28));transform-origin:top center;animation:drop .35s cubic-bezier(.3,1.5,.5,1);transition:opacity .5s,transform .5s}
@keyframes drop{from{transform:translateY(-60px) rotate(-4deg);opacity:0}}
.tkw.out{opacity:0;transform:translateY(24px) scale(.92)}
.tkw:before{content:"";position:absolute;top:-6px;left:50%;margin-left:-14px;width:28px;height:9px;border-radius:3px;background:linear-gradient(#e9f0f3,#7f939f);z-index:2}
.tk{background:var(--wh);padding:10px 8px 14px;font-size:12px;position:relative;color:var(--nv);background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(23,41,61,.025) 3px 4px)}
.tkh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--nv);padding-bottom:3px;margin-bottom:3px}
.tkh b{font-weight:900;font-size:14px}.tkh i{font-family:var(--d);font-style:normal;font-size:11px;color:var(--bt)}
.pb{height:7px;background:repeating-linear-gradient(90deg,var(--st) 0 3px,#fff 3px 5px);border:1px solid var(--nv);margin:2px 0 5px;position:relative}

  else if(k==="ArrowUp"||k==="+"){s.n=Math.min(G.pots[s.p].cap,s.n+1);drawSheet()}else if(k==="ArrowDown"||k==="-"){s.n=Math.max(1,s.n-1);drawSheet()}
  else if(k==="ArrowRight"||k==="ArrowLeft"){var j=ds.indexOf(s.d)+(k==="ArrowRight"?-1:1);s.d=ds[(j+ds.length)%ds.length];drawSheet()}
  else if(k==="Tab"){return}
  else if(k==="p"||k==="P"){var fr=G.pots.map(function(p,q){return p.use?-1:q}).filter(function(q){return q>=0}),c=fr.indexOf(s.p);s.p=fr[(c+1)%fr.length];s.n=Math.min(s.n,G.pots[s.p].cap);drawSheet()}
  e.preventDefault();return}
 if(k==="1"||k==="2"){stove.children[+k-1].click();e.preventDefault()}
 else if(k==="s"||k==="S"||k===" "){autoServe();e.preventDefault()}
 else if(k==="Escape"||k==="p"||k==="P")setPause(true)});
/* screens */
function screen(h){ov.innerHTML=h;ov.hidden=false;ov.scrollTop=0}
function heroHTML(){return '<div class="hero">'+potSVG({state:"cook",dish:"beet",n:6,pot:{cap:6}})+potSVG({state:"ready",dish:"kubbeh",n:8,pot:{cap:8}})+'</div>'}
function woltBtn(c){return '<a class="btn w" href="'+WOLT+'" target="_blank" rel="noopener">'+(c||"הזמנה אמיתית ב־Wolt")+'</a>'}
function title(){inGame=false;paused=false;
 screen('<div class="pn"><div class="top"><span>שיא כולל: <b style="color:#fff;font-family:var(--d);font-weight:400">'+best()+'</b></span><button class="btn s" data-a="mute">'+(sv.muted?"קול כבוי":"קול פעיל")+'</button></div><div class="sign"><h1>משמרת על האש</h1><p>SABICH COMPLETE · IBN GVIROL 99</p></div>'+heroHTML()+'<button class="btn" data-a="select">התחלת משמרת</button><div class="bs2"><button class="btn t" data-a="rules">איך משחקים</button>'+woltBtn("Wolt")+'</div><div class="cta">משחק בדיוני. המספרים הם תרחישי משחק. סביח קומפלט, אבן גבירול 99, תל אביב.</div></div>')}
function rules(){screen('<div class="pn"><div class="paper"><h2><span>איך משחקים</span><i>RULES</i></h2><ul><li><b>כל פתק הוא שולחן.</b> הקישו על שורה בפתק כדי להגיש מסיר מוכן. הסבלנות (הפס העליון) אוזלת.</li><li><b>שתי להבות.</b> הקישו על להבה פנויה: בחרו מנה, סיר וכמות.</li><li><b>מתמטיקה:</b> המתכון הוא ל־4 מנות. מנות רבות יותר = מכפילים את החומרים. לכל סיר קיבולת מוגבלת , ייתכן שתצטרכו כמה סירים ברצף.</li><li><b>בשרי / טבעוני:</b> סיר שבישל בשר דורש שטיפה (+'+WASH+'״) לפני מרק טבעוני.</li><li><b>מוכן = ✓.</b> מנה שלא מוגשת תוך '+BURN+'״ נשרפת.</li><li><b>כוכבים:</b> 1 , חצי מהסועדים · 2 , 80% · 3 , כולם, כמעט בלי פחת.</li></ul><div class="fine">מקלדת: 1/2 להבות · S הגשה אוטומטית · חיצים וEnter בבחירה · P/Esc השהיה · M קול</div></div><button class="btn" data-a="title">הבנתי</button></div>')}
function select(){inGame=false;var h='<div class="pn"><div class="top"><span>בחרו משמרת</span><button class="btn s" data-a="title">חזרה</button></div>';
 SH.forEach(function(s,i){var lock=i>0&&sv.stars[i-1]<1;h+='<button class="sh" data-a="story" data-v="'+i+'"'+(lock?" disabled":"")+'><span class="n">'+(i+1)+'</span><span class="m">'+s.n+'<small>'+s.d+' סועדים · סירים '+s.pots.join("/")+(lock?" · נעול":"")+'</small></span>'+stars(sv.stars[i])+'</button>'});
 screen(h+'<div class="cta">פותחים משמרת הבאה עם כוכב אחד לפחות</div></div>')}
function story(i){G=null;SEL=null;screen('<div class="pn"><div class="paper"><h2><span>משמרת '+(i+1)+' · '+SH[i].n+'</span><i>#0'+(i+1)+'</i></h2><p style="margin:0 0 6px">'+SH[i].story+'</p><ul><li>'+SH[i].d+' סועדים ב־'+SH[i].g.length+' קבוצות</li><li>סירים: '+SH[i].pots.join(" · ")+' מנות</li><li>בתפריט: '+SH[i].dishes.map(function(k){return D[k].n}).join(", ")+'</li></ul></div><button class="btn" data-a="play" data-v="'+i+'">יאללה, על האש!</button><button class="btn s" data-a="select">חזרה</button></div>')}
function finish(){
 inGame=false;var s=G.s,fr=G.served/s.d,n=fr>=1&&G.waste<=2?3:fr>=.8?2:fr>=.5?1:0,i=G.i,nw=G.score>sv.score[i];
 if(n>sv.stars[i])sv.stars[i]=n;if(nw)sv.score[i]=G.score;save();snd(n?"win":"lose");G.stars=n;
 var nx=i<5&&n>0;
 screen('<div class="pn big"><div class="paper"><h2><span>'+(n?"סוף משמרת":"המשמרת נכשלה")+' '+(i+1)+'</span><i>'+s.n+'</i></h2>'+stars(n)+'<p style="text-align:center;margin:6px 0">'+(n===3?"מטבח מושלם! כולם אכלו חם.":n?"הצלחתם , עוד אפשר לחדד.":"לא נורא, מתחילים שוב ומתכננים סירים.")+'</p><div class="stats"><span>סועדים שהוגשו</span><b>'+G.served+'/'+s.d+'</b><span>עזבו רעבים</span><b>'+G.lost+'</b><span>מנות שנשרפו</span><b>'+G.waste+'</b><span>ניקוד</span><b>'+G.score+(nw?" ★":"")+'</b><span>שיא משמרת</span><b>'+sv.score[i]+'</b></div></div>'+(nx?'<button class="btn" data-a="story" data-v="'+(i+1)+'">למשמרת הבאה</button>':'')+'<div class="bs2"><button class="btn t" data-a="play" data-v="'+i+'">שוב</button><button class="btn s" data-a="share">שיתוף</button></div><div class="bs2"><button class="btn s" data-a="select">משמרות</button>'+woltBtn("Wolt")+'</div></div>')}
function share(){var g=G,t="משמרת על האש · סביח קומפלט, אבן גבירול 99\nמשמרת "+(g.i+1)+": "+"★".repeat(g.stars||0)+"☆".repeat(3-(g.stars||0))+" · "+g.score+" נקודות · "+g.served+"/"+g.s.d+" סועדים\nשחקו: "+URL_G;
 if(navigator.share){navigator.share({title:"משמרת על האש",text:t,url:URL_G}).catch(function(e){if(e.name!=="AbortError")shareNote(t)})}
 else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){shareNote("הועתק ללוח!")},function(){shareNote(t)})}
 else shareNote(t)}
function shareNote(t){var d=$("#sn");if(!d){d=document.createElement("div");d.id="sn";d.className="cta";d.style.whiteSpace="pre-line";$(".pn",ov).appendChild(d)}d.textContent=t}
ov.addEventListener("click",function(e){var t=e.target.closest("[data-a]");if(!t||t.disabled)return;var a=t.dataset.a,v=+t.dataset.v;
 if(a==="select")select();else if(a==="title")title();else if(a==="rules")rules();else if(a==="story")story(v);
 else if(a==="play")startShift(v);else if(a==="resume")setPause(false);else if(a==="restart"){startShift(G.i)}
 else if(a==="share")share();else if(a==="mute"){sv.muted=sv.muted?0:1;save();paintMute();title();if(!sv.muted)snd("tick")}});
paintMute();title();
})();
</script>
