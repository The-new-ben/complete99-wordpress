:root{--st:#DFE8EC;--nv:#17293D;--bt:#AA174C;--tq:#008D99;--wh:#fff;--tq2:#6fdbe4;--st2:#b9c9d1;--nv2:#233b55;--f:Heebo,"Segoe UI","Arial Hebrew",Arial,sans-serif;--d:"Archivo Black",Heebo,"Arial Black",Impact,sans-serif;--S:clamp(50px,15vmin,72px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--nv);overflow:hidden}
body{font-family:var(--f);font-weight:700;color:var(--nv);font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;font-weight:800;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
a{color:var(--tq);font-weight:800}a:hover{color:var(--bt)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tq2);outline-offset:2px}
#app{position:fixed;inset:0;max-width:900px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:var(--nv)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;padding:5px;pointer-events:none;align-items:flex-start;direction:ltr}
#mmw{flex:0 0 auto;border:3px solid var(--nv);border-radius:5px;background:var(--nv);box-shadow:0 0 0 2px var(--tq2),0 0 10px var(--tq)}
#mmc{display:block;width:clamp(84px,25vmin,150px);height:auto}
#mid{flex:1;min-width:0;display:flex;justify-content:center;direction:rtl}
#tk{width:100%;max-width:300px;background:var(--wh);padding:4px 8px 10px;font-size:11.5px;line-height:1.25;clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),94% 100%,88% calc(100% - 5px),82% 100%,76% calc(100% - 5px),70% 100%,64% calc(100% - 5px),58% 100%,52% calc(100% - 5px),46% 100%,40% calc(100% - 5px),34% 100%,28% calc(100% - 5px),22% 100%,16% calc(100% - 5px),10% 100%,4% calc(100% - 5px),0 100%)}
#tkh{display:flex;justify-content:space-between;border-bottom:1.5px dashed var(--nv);padding-bottom:2px;margin-bottom:3px;font-weight:900;font-size:12px}
#tkh i{font-family:var(--d);font-style:normal;font-weight:400;color:var(--bt)}
#dots{display:flex;gap:3px;margin-bottom:3px;direction:rtl}#dots span{flex:1;height:6px;background:var(--st);border:1px solid var(--nv)}#dots .d{background:var(--nv)}#dots .c{background:var(--bt)}
#tkm{min-height:2.5em}
#rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#gw{position:relative;width:clamp(62px,17vmin,92px);aspect-ratio:1}#gw canvas{width:100%;height:100%;display:block}
#lv{position:absolute;inset:auto 0 -3px;text-align:center;font-family:var(--d);font-weight:400;font-size:11px;color:var(--wh);background:var(--nv);border-radius:3px;margin:0 14px}
.bx{display:flex;gap:4px;pointer-events:auto}
.ib{width:36px;height:36px;border-radius:6px;background:var(--nv);color:var(--wh);display:grid;place-items:center;border:2px solid var(--nv2)}.ib svg{width:18px;height:18px}.ib:active{background:var(--tq)}
#cn{font-family:var(--d);font-size:12px;color:var(--wh);background:var(--nv);padding:2px 7px;border-radius:3px;border:1.5px solid var(--tq2)}
#ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom));direction:ltr;pointer-events:none;gap:6px}
#ctl .g{display:flex;gap:8px;pointer-events:auto}
