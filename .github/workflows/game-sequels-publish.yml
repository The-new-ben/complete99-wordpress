name: Publish Complete99 game sequels
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish two reviewed games and noindex the three game parents
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: complete99-wordpress-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and its successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          WP_PRODUCTION_READY: ${{ vars.WP_PRODUCTION_READY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$WP_PRODUCTION_READY" = true
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/wordpress-ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success" --jq '.workflow_runs[] | select(.event == "push") | .head_sha' | grep -Fx "$GITHUB_SHA"
  pages:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify or publish only the game pages
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          APPLY_GAMES: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APPLY_GAMES" = true ]; then
            python scripts/publish-game-sequels.py --publish
          else
            python scripts/publish-game-sequels.py
          fi
      - name: Keep game publication receipt and page backups
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete99-game-sequels-receipt
          path: game-sequels-audit/
          if-no-files-found: warn
