name: Deploy Complete99 WordPress

on:
  workflow_dispatch:
    inputs:
      rollback_exercise:
        description: Exercise rollback and redeploy (requires an existing healthy release)
        required: true
        default: true
        type: boolean
      bootstrap_code_snippets:
        description: Install the approved WordPress.org Code Snippets plugin if absent
        required: true
        default: true
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: complete99-wordpress-production
  cancel-in-progress: false

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a production deployment from any non-main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys are restricted to refs/heads/main." >&2
            exit 1
          fi

  require-production-ready:
    needs: require-main
    runs-on: ubuntu-latest
    steps:
      - name: Require the explicit production readiness switch
        env:
          WP_PRODUCTION_READY: ${{ vars.WP_PRODUCTION_READY }}
        shell: bash
        run: |
          if [[ "$WP_PRODUCTION_READY" != "true" ]]; then
            echo "WP_PRODUCTION_READY must be exactly true before production deployment." >&2
            exit 1
          fi

  require-green-ci:
    needs:
      - require-main
      - require-production-ready
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.exact_ci.outputs.run_id }}
    steps:
      - name: Require successful WordPress CI for this exact commit
        id: exact_ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/wordpress-ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&status=success&per_page=10")"
          RUNS_JSON="$response" python - <<'PY'
          import json
          import os
          runs = json.loads(os.environ["RUNS_JSON"]).get("workflow_runs", [])
          trusted = [
              run
              for run in runs
              if run.get("head_sha") == os.environ["GITHUB_SHA"]
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          ]
          if not trusted:
              raise SystemExit("No successful WordPress CI run exists for this exact commit.")
          run_id = trusted[0].get("id")
          if not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit("The exact-commit WordPress CI run ID is invalid.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          PY

  deploy:
    needs:
      - require-main
      - require-production-ready
      - require-green-ci
    runs-on: [self-hosted, Windows, X64, complete99-deploy]
    environment: production
    steps:
      - name: Check out approved production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download the immutable exact-commit CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: complete99-wordpress-package
          path: ${{ runner.temp }}/complete99-verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.require-green-ci.outputs.ci_run_id }}

      - name: Validate the downloaded immutable release
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/validate-package.py --dist $releaseDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundleFiles = @(Get-ChildItem -LiteralPath $releaseDir -File)
          if ($bundleFiles.Count -ne 4) {
            Write-Error "The immutable release bundle must contain exactly four verified files."
            exit 1
          }
          $approvedCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($approvedCommit -ne $env:GITHUB_SHA) {
            Write-Error "The checked-out production source does not match GITHUB_SHA."
            exit 1
          }

      - name: Require the 1.3.0 rollback and identical-artifact redeploy exercise
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $integrityPath = Join-Path $releaseDir "complete99-platform-integrity.json"
          $releaseMetadata = Get-Content -LiteralPath $integrityPath -Raw | ConvertFrom-Json
          if ($releaseMetadata.version -eq "1.3.0" -and "${{ inputs.rollback_exercise }}" -ne "true") {
            Write-Error "Complete99 Platform 1.3.0 requires rollback_exercise=true before any production request."
            exit 1
          }

      - name: Require the secure sync bootstrap before any live request
        env:
          COMPLETE99_WORDPRESS_SYNC_SECRET: ${{ secrets.COMPLETE99_WORDPRESS_SYNC_SECRET }}
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty($env:COMPLETE99_WORDPRESS_SYNC_SECRET) -or
              $env:COMPLETE99_WORDPRESS_SYNC_SECRET.Length -lt 32 -or
              $env:COMPLETE99_WORDPRESS_SYNC_SECRET.Length -gt 4096) {
            Write-Error "The production sync secret must be configured with 32 to 4096 characters."
            exit 1
          }

      - name: Run live recovery probe and dry-run acceptance
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $bootstrapArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          & python scripts/recover-wordpress.py `
            --discover `
            --probe-id "c99-recovery-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dryId = "c99-dry-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & python scripts/deploy-wordpress.py `
            --dist $releaseDir `
            --dry-run `
            --deployment-id $dryId `
            @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $auditVerification = @'
          import json
          import pathlib
          import sys
          record = json.loads((pathlib.Path("deploy-audit") / f"{sys.argv[1]}.json").read_text())
          assert record["result"] == "dry-run-passed"
          assert record["cleanup"]["snippet_active"] is False
          assert record["cleanup"]["row_absence_verified"] is True
          assert record["cleanup"]["route_404"] is True
          '@
          $auditVerification | python - $dryId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy the exact CI artifact with independent verification
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          COMPLETE99_WORDPRESS_SYNC_SECRET: ${{ secrets.COMPLETE99_WORDPRESS_SYNC_SECRET }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          $deployArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.rollback_exercise }}" -eq "true") {
            $deployArgs += "--rollback-exercise"
          }
          & python scripts/deploy-wordpress.py `
            --dist $releaseDir `
            --deployment-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --mutation-marker $mutationMarker `
            @deployArgs
          exit $LASTEXITCODE

      - name: Detect whether the production mutation edge was crossed
        id: mutation_state
        if: failure()
        shell: powershell
        run: |
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          if (Test-Path -LiteralPath $mutationMarker -PathType Leaf) {
            "started=true" >> $env:GITHUB_OUTPUT
          } else {
            "started=false" >> $env:GITHUB_OUTPUT
          }

      - name: Recover any interrupted mutation with a recreated temporary bridge
        if: failure() && steps.mutation_state.outputs.started == 'true'
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $bootstrapArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          & python scripts/recover-wordpress.py `
            --deployment-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            @bootstrapArgs
          exit $LASTEXITCODE

      - name: Remove the runner-local mutation marker
        if: always()
        shell: powershell
        run: |
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          if (Test-Path -LiteralPath $mutationMarker -PathType Leaf) {
            Remove-Item -LiteralPath $mutationMarker -Force
          }

      - name: Upload non-secret deployment audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete99-wordpress-deploy-audit
          path: |
            deploy-audit/*.json
            recovery-audit/*.json
          if-no-files-found: warn
          retention-days: 30
