name: Deploy Complete99 WordPress

on:
  workflow_dispatch:
    inputs:
      rollback_exercise:
        description: Exercise rollback and redeploy (requires an existing healthy release)
        required: true
        default: false
        type: boolean
      bootstrap_code_snippets:
        description: Install the approved WordPress.org Code Snippets plugin if absent
        required: true
        default: true
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: complete99-wordpress-production
  cancel-in-progress: false

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a production deployment from any non-main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys are restricted to refs/heads/main." >&2
            exit 1
          fi

  require-production-ready:
    needs: require-main
    runs-on: ubuntu-latest
    steps:
      - name: Require the explicit production readiness switch
        env:
          WP_PRODUCTION_READY: ${{ vars.WP_PRODUCTION_READY }}
        shell: bash
        run: |
          if [[ "$WP_PRODUCTION_READY" != "true" ]]; then
            echo "WP_PRODUCTION_READY must be exactly true before production deployment." >&2
            exit 1
          fi

  require-green-ci:
    needs:
      - require-main
      - require-production-ready
    runs-on: ubuntu-latest
    steps:
      - name: Require successful WordPress CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          response="$(gh api \
            --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/wordpress-ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1")"
          RUNS_JSON="$response" python - <<'PY'
          import json
          import os
          runs = json.loads(os.environ["RUNS_JSON"]).get("workflow_runs", [])
          if not runs or runs[0].get("head_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("No successful WordPress CI run exists for this exact commit.")
          if runs[0].get("conclusion") != "success":
              raise SystemExit("The exact-commit WordPress CI run is not successful.")
          PY

  deploy:
    needs:
      - require-main
      - require-production-ready
      - require-green-ci
    runs-on: [self-hosted, Windows, X64, complete99-deploy]
    environment: production
    steps:
      - name: Check out approved production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Validate source and package
        run: |
          php --version
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          python scripts/lint-php.py
          python -m unittest discover -s tests -v
          python scripts/secret-scan.py
          python scripts/build-plugin-zip.py --verify-reproducible
          python scripts/validate-package.py
          git diff --exit-code -- plugin-dist

      - name: Deploy with independent health and cleanup verification
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $bootstrapArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          & python scripts/recover-wordpress.py `
            --discover `
            --probe-id "c99-recovery-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dryId = "c99-dry-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & python scripts/deploy-wordpress.py `
            --dry-run `
            --deployment-id $dryId `
            @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $auditVerification = @'
          import json
          import pathlib
          import sys
          record = json.loads((pathlib.Path("deploy-audit") / f"{sys.argv[1]}.json").read_text())
          assert record["result"] == "dry-run-passed"
          assert record["cleanup"]["snippet_active"] is False
          assert record["cleanup"]["row_absence_verified"] is True
          assert record["cleanup"]["route_404"] is True
          '@
          $auditVerification | python - $dryId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $deployArgs = @($bootstrapArgs)
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.rollback_exercise }}" -eq "true") {
            $deployArgs += "--rollback-exercise"
          }
          & python scripts/deploy-wordpress.py `
            --deployment-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            @deployArgs
          exit $LASTEXITCODE

      - name: Recover any interrupted mutation with a recreated temporary bridge
        if: failure()
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $recoveryFailed = 0
          $bootstrapArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          foreach ($deploymentId in @(
            "c99-dry-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          )) {
            & python scripts/recover-wordpress.py `
              --deployment-id $deploymentId `
              @bootstrapArgs
            if ($LASTEXITCODE -ne 0) { $recoveryFailed = 1 }
          }
          exit $recoveryFailed

      - name: Upload non-secret deployment audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete99-wordpress-deploy-audit
          path: |
            deploy-audit/*.json
            recovery-audit/*.json
          if-no-files-found: warn
          retention-days: 30
