name: Deploy Complete99 WordPress

on:
  workflow_dispatch:
    inputs:
      rollback_exercise:
        description: Exercise rollback and redeploy (requires an existing healthy release)
        required: true
        default: true
        type: boolean
      bootstrap_code_snippets:
        description: Install the approved WordPress.org Code Snippets plugin if absent
        required: true
        default: true
        type: boolean
      orphaned_rollback_proof:
        description: Reviewed repository-relative proof for one orphaned rollback lock
        required: false
        default: ''
        type: string
      orphaned_rollback_observe_only:
        description: Capture a reviewed, non-secret orphaned rollback database observation without deployment
        required: true
        default: false
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: complete99-wordpress-production
  cancel-in-progress: false

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a production deployment from any non-main ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys are restricted to refs/heads/main." >&2
            exit 1
          fi

  require-production-ready:
    needs: require-main
    runs-on: ubuntu-latest
    steps:
      - name: Require the explicit production readiness switch
        env:
          WP_PRODUCTION_READY: ${{ vars.WP_PRODUCTION_READY }}
        shell: bash
        run: |
          if [[ "$WP_PRODUCTION_READY" != "true" ]]; then
            echo "WP_PRODUCTION_READY must be exactly true before production deployment." >&2
            exit 1
          fi

  require-green-ci:
    needs:
      - require-main
      - require-production-ready
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.exact_ci.outputs.run_id }}
    steps:
      - name: Require successful WordPress CI for this exact commit
        id: exact_ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/wordpress-ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&status=success&per_page=10")"
          RUNS_JSON="$response" python - <<'PY'
          import json
          import os
          runs = json.loads(os.environ["RUNS_JSON"]).get("workflow_runs", [])
          trusted = [
              run
              for run in runs
              if run.get("head_sha") == os.environ["GITHUB_SHA"]
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          ]
          if not trusted:
              raise SystemExit("No successful WordPress CI run exists for this exact commit.")
          run_id = trusted[0].get("id")
          if not isinstance(run_id, int) or run_id <= 0:
              raise SystemExit("The exact-commit WordPress CI run ID is invalid.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          PY

  deploy:
    needs:
      - require-main
      - require-production-ready
      - require-green-ci
    runs-on: [self-hosted, Windows, X64, complete99-deploy]
    environment: production
    steps:
      - name: Check out approved production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Download the immutable exact-commit CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: complete99-wordpress-package
          path: ${{ runner.temp }}/complete99-verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.require-green-ci.outputs.ci_run_id }}

      - name: Validate the downloaded immutable release
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -c "import sys; raise SystemExit('Python 3.11 or newer is required: ' + sys.version if sys.version_info < (3, 11) else 0)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python scripts/validate-package.py --dist $releaseDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundleFiles = @(Get-ChildItem -LiteralPath $releaseDir -File)
          if ($bundleFiles.Count -ne 4) {
            Write-Error "The immutable release bundle must contain exactly four verified files."
            exit 1
          }
          $approvedCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($approvedCommit -ne $env:GITHUB_SHA) {
            Write-Error "The checked-out production source does not match GITHUB_SHA."
            exit 1
          }

      - name: Require the 1.3.1 rollback and identical-artifact redeploy exercise
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $integrityPath = Join-Path $releaseDir "complete99-platform-integrity.json"
          $releaseMetadata = Get-Content -LiteralPath $integrityPath -Raw | ConvertFrom-Json
          if ($releaseMetadata.version -eq "1.3.1" -and "${{ inputs.rollback_exercise }}" -ne "true") {
            Write-Error "Complete99 Platform 1.3.1 requires rollback_exercise=true before any production request."
            exit 1
          }

      - name: Require the secure sync bootstrap before any live request
        env:
          COMPLETE99_WORDPRESS_SYNC_SECRET: ${{ secrets.COMPLETE99_WORDPRESS_SYNC_SECRET }}
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty($env:COMPLETE99_WORDPRESS_SYNC_SECRET) -or
              $env:COMPLETE99_WORDPRESS_SYNC_SECRET.Length -lt 32 -or
              $env:COMPLETE99_WORDPRESS_SYNC_SECRET.Length -gt 4096) {
            Write-Error "The production sync secret must be configured with 32 to 4096 characters."
            exit 1
          }

      - name: Run live recovery probe and dry-run acceptance
        id: preflight
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
          COMPLETE99_ORPHANED_ROLLBACK_PROOF: ${{ inputs.orphaned_rollback_proof }}
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $bootstrapArgs = @()
          $observationArgs = @()
          $validationArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          if ("${{ inputs.orphaned_rollback_observe_only }}" -eq "true") {
            $observationArgs += "--observe-orphaned-rollback"
            $validationArgs += "--expect-observation"
          }
          $probeId = "c99-recovery-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $recoveryOutput = @(& python scripts/recover-wordpress.py `
            --discover `
            --probe-id $probeId `
            @observationArgs `
            @bootstrapArgs)
          $recoveryExitCode = $LASTEXITCODE
          if ($recoveryExitCode -ne 0) { exit $recoveryExitCode }
          $recoverySummary = ($recoveryOutput -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($recoverySummary)) {
            Write-Error "The live recovery probe did not return its exact audit summary."
            exit 1
          }
          Write-Output $recoverySummary
          $env:COMPLETE99_RECOVERY_SUMMARY_JSON = $recoverySummary
          & python scripts/validate-recovery-audit.py `
            --expected-probe-id $probeId `
            @validationArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("${{ inputs.orphaned_rollback_observe_only }}" -eq "true") {
            exit 0
          }

          $dryId = "c99-dry-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & python scripts/deploy-wordpress.py `
            --dist $releaseDir `
            --dry-run `
            --deployment-id $dryId `
            @bootstrapArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $auditVerification = @'
          import json
          import pathlib
          import sys
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          record = json.loads((pathlib.Path("deploy-audit") / f"{sys.argv[1]}.json").read_text())
          cleanup = record.get("cleanup", {})
          require(record.get("deployment_id") == sys.argv[1], "Dry-run audit deployment ID changed")
          require(record.get("result") == "dry-run-passed", "Dry-run audit did not pass")
          require(cleanup.get("snippet_active") is False, "Dry-run bridge remained active")
          require(cleanup.get("row_absence_verified") is True, "Dry-run bridge row remained")
          require(cleanup.get("route_404") is True, "Dry-run bridge route remained")
          '@
          $auditVerification | python - $dryId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy the exact CI artifact with independent verification
        id: production_deploy
        if: inputs.orphaned_rollback_observe_only != true
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          COMPLETE99_WORDPRESS_SYNC_SECRET: ${{ secrets.COMPLETE99_WORDPRESS_SYNC_SECRET }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "complete99-verified-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          $deployArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.rollback_exercise }}" -eq "true") {
            $deployArgs += "--rollback-exercise"
          }
          & python scripts/deploy-wordpress.py `
            --dist $releaseDir `
            --deployment-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --mutation-marker $mutationMarker `
            @deployArgs
          exit $LASTEXITCODE

      - name: Detect whether the production mutation edge was crossed
        id: mutation_state
        if: failure() && steps.production_deploy.outcome == 'failure'
        shell: powershell
        run: |
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          if (Test-Path -LiteralPath $mutationMarker -PathType Leaf) {
            "started=true" >> $env:GITHUB_OUTPUT
          } else {
            "started=false" >> $env:GITHUB_OUTPUT
          }

      - name: Recover any interrupted mutation with a recreated temporary bridge
        id: recovery
        if: failure() && steps.production_deploy.outcome == 'failure' && steps.mutation_state.outputs.started == 'true'
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          $bootstrapArgs = @()
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.bootstrap_code_snippets }}" -eq "true") {
            $bootstrapArgs += "--bootstrap-code-snippets"
          }
          & python scripts/recover-wordpress.py `
            --deployment-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            @bootstrapArgs
          exit $LASTEXITCODE

      - name: Remove the runner-local mutation marker
        if: always()
        shell: powershell
        run: |
          $mutationMarker = Join-Path $env:RUNNER_TEMP "complete99-live-mutation-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.marker"
          if (Test-Path -LiteralPath $mutationMarker -PathType Leaf) {
            Remove-Item -LiteralPath $mutationMarker -Force
          }

      - name: Install pinned WooCommerce and materialize the live catalog
        id: commerce
        if: inputs.orphaned_rollback_observe_only != true
        continue-on-error: true
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          & python scripts/materialize-woocommerce.py `
            --deployment-id "c99-commerce-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE

      - name: Recover an interrupted WooCommerce bridge
        id: commerce_recovery
        if: steps.commerce.outcome == 'failure'
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ALLOWED_DEPLOY_HOSTS: ${{ vars.WP_ALLOWED_DEPLOY_HOSTS }}
        shell: powershell
        run: |
          & python scripts/materialize-woocommerce.py `
            --deployment-id "c99-commerce-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --recover-bridge
          exit $LASTEXITCODE

      - name: Validate exact deployment-stage audit outcomes
        if: always()
        env:
          COMPLETE99_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          COMPLETE99_PRODUCTION_OUTCOME: ${{ steps.production_deploy.outcome }}
          COMPLETE99_MUTATION_OUTCOME: ${{ steps.mutation_state.outcome }}
          COMPLETE99_MUTATION_STARTED: ${{ steps.mutation_state.outputs.started }}
          COMPLETE99_RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          COMPLETE99_COMMERCE_OUTCOME: ${{ steps.commerce.outcome }}
          COMPLETE99_COMMERCE_RECOVERY_OUTCOME: ${{ steps.commerce_recovery.outcome }}
          COMPLETE99_OBSERVATION_ONLY: ${{ inputs.orphaned_rollback_observe_only }}
        shell: powershell
        run: |
          & python scripts/validate-recovery-audit.py `
            --stage-outcomes `
            --dry-run-id "c99-dry-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --production-id "c99-prod-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --commerce-id "c99-commerce-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE

      - name: Fail closed after an audited commerce failure
        if: always() && steps.commerce.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "WooCommerce or catalog verification failed. The recovery and audit steps have completed."
          exit 1

      - name: Upload non-secret deployment audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete99-wordpress-deploy-audit
          path: |
            deploy-audit/*.json
            recovery-audit/*.json
            commerce-audit/*.json
          if-no-files-found: error
          retention-days: 30
