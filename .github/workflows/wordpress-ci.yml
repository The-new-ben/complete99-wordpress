name: WordPress CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete99-wordpress-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Confirm PHP runtime
        run: php --version

      - name: PHP syntax
        run: python scripts/lint-php.py

      - name: Contract tests
        run: python -m unittest discover -s tests -v

      - name: Secret scan
        run: python scripts/secret-scan.py

      - name: Require a version advance when plugin source changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python scripts/verify-release-discipline.py --base-ref "$BASE_REF"

      - name: Reproducible package
        run: python scripts/build-plugin-zip.py --verify-reproducible

      - name: Package validation
        run: python scripts/validate-package.py

      - name: Prove checked-in release artifacts are current
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- plugin-dist &&
          test -z "$(git ls-files --others --exclude-standard -- plugin-dist)"

      - name: Prepare the exact validated release bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(python -c 'import json; print(json.load(open("plugin-dist/complete99-platform-integrity.json", encoding="utf-8"))["artifact"])')" &&
          bundle="$RUNNER_TEMP/complete99-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" &&
          mkdir "$bundle" &&
          cp "plugin-dist/$artifact" "$bundle/$artifact" &&
          cp "plugin-dist/$artifact.sha256" "$bundle/$artifact.sha256" &&
          cp plugin-dist/complete99-platform.json "$bundle/complete99-platform.json" &&
          cp plugin-dist/complete99-platform-integrity.json "$bundle/complete99-platform-integrity.json" &&
          python scripts/validate-package.py --dist "$bundle" &&
          test "$(find "$bundle" -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload verified package and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete99-wordpress-package
          path: ${{ runner.temp }}/complete99-release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
